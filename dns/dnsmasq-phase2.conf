# ---- TeamX DNS, Phase 2 ----
# Identical file on Mac 1 (primary) and Mac 3 (backup).
# Path: /opt/homebrew/etc/dnsmasq.conf   (Intel Mac: /usr/local/etc/dnsmasq.conf)
# Start:   sudo brew services start dnsmasq      (port 53 needs root)
# Restart: sudo brew services restart dnsmasq    (only needed when THIS file changes)

# Don't read /etc/resolv.conf; forward non-project names upstream
no-resolv
server=8.8.8.8
server=1.1.1.1

# We are authoritative for teamX.test: never forward it upstream.
# A name not in teamx.hosts gets NXDOMAIN instead of leaking to Google.
local=/teamX.test/

# Records live in a separate hosts file so a record change only needs
# `sudo killall -HUP dnsmasq` (SIGHUP clears the cache and re-reads addn-hosts).
# no-hosts = ignore this Mac's own /etc/hosts so answers are identical on both servers.
no-hosts
addn-hosts=/opt/homebrew/etc/teamx.hosts

# Phase 2 / Extension B: short, visible TTL (seconds) on our records.
# (dnsmasq's default for local records is 0 = "don't cache", which would make the TTL demo impossible.)
local-ttl=30

# Log every query so we can show WHICH server answered during failover
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log
