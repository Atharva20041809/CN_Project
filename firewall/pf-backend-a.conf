# ---- Extension C: Service isolation for Backend A (Mac 3, tcp/3001) ----
# Loaded by fw.sh into the pf anchor "com.apple/teamx". macOS's stock /etc/pf.conf already
# evaluates every anchor under com.apple/*, so /etc/pf.conf itself is never edited.
#
# Rule logic (pf: first matching "quick" rule wins):
#   1. traffic on loopback (this Mac talking to itself) -> allowed
#   2. TCP to 3001 from an edge machine (table <edges>) -> allowed
#   3. TCP to 3001 from anyone else                      -> silently dropped

# Machines allowed to reach the backend. Mac 2 = primary edge.
# Add the standby edge at runtime with:  sudo ./fw.sh allow <ip>
table <edges> persist { 10.7.3.38 }

pass  in quick on lo0 inet proto tcp from any to any port 3001
pass  in quick inet proto tcp from <edges> to any port 3001 keep state
block drop in quick inet proto tcp from any to any port 3001
