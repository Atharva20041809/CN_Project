# ---- Main nginx config for Mac 2 (and Mac 3 standby) ----
# Path: /opt/homebrew/etc/nginx/nginx.conf
# Replaces the old one, which still had a leftover Phase-0 block:
#   upstream backend_servers + a bare "server { listen 80; }" that proxied PLAIN HTTP
#   straight to the backends for anyone who hit Mac 2's IP — bypassing HTTPS.
# All project config lives in servers/teamX.conf.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;            # don't advertise the nginx version in headers / error pages

    include /opt/homebrew/etc/nginx/servers/*.conf;
}
