# ---- TeamX Edge, Phase 2 — PRIMARY (Mac 2, 10.7.3.38) ----
# Install:  cp teamX-phase2.conf /opt/homebrew/etc/nginx/servers/teamX.conf
# Apply:    sudo nginx -t && sudo nginx -s reload
#
# !! CHECK BEFORE USE: ssl_certificate paths below must match where your
#    server.crt / server.key actually live on Mac 2 (copy them from your Phase 1 config).

# Access log that records WHICH upstream served each request and whether a retry happened.
# e.g.  upstream=10.7.3.174:3001, 10.7.31.162:3002 ustatus=502, 200   <- A failed, B served it
log_format teamx '$remote_addr [$time_local] "$request" $status '
                 'upstream=$upstream_addr ustatus=$upstream_status '
                 'urt=$upstream_response_time';

upstream team_backends {
    # Strategy: round-robin (nginx default).
    # Health checking: PASSIVE. Open-source nginx has no active health_check (that is nginx Plus).
    # 1 failed attempt (max_fails) => backend marked unavailable for 10s (fail_timeout),
    # after which nginx tries it again with a real request; success puts it back in rotation.
    server 10.7.3.174:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
    server 10.7.31.162:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
}

# Plain HTTP -> redirect to HTTPS
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                      # nginx >= 1.25.1 (Homebrew is newer). Older: "listen 443 ssl http2;"
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;   # <-- CHECK PATH
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;   # <-- CHECK PATH
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/teamx_access.log teamx;
    error_log  /opt/homebrew/var/log/nginx/teamx_error.log warn;

    # Evidence headers (Phase 2):
    #   X-Edge      -> which edge machine served the request (needed for Extension E cutover)
    #   X-Upstream  -> which backend(s) nginx tried; two entries = failover retry happened
    # (X-Upstream reveals backend IPs; it is a demo/debug aid — remove it in a real deployment.)
    add_header X-Edge            "mac2-primary"   always;
    add_header X-Upstream        $upstream_addr   always;
    add_header X-Upstream-Status $upstream_status always;

    location / {
        proxy_pass http://team_backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Failover (Extension D):
        # - stopped backend  -> TCP RST -> "error"  -> retried on the other backend instantly
        # - silent backend   -> no SYN-ACK in 2s -> "timeout" -> retried on the other backend
        # - backend 502/503/504 -> retried on the other backend
        # Non-idempotent requests (POST etc.) are NOT retried by default — that is deliberate.
        proxy_connect_timeout       2s;
        proxy_send_timeout          5s;
        proxy_read_timeout          5s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;     # at most: original backend + 1 retry
        proxy_next_upstream_timeout 6s;
    }
}
