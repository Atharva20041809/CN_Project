# ---- TeamX Edge, PHASE 1 (Mac 2) — the config that actually ran in Phase 1 ----
# Taken from `sudo nginx -T` on Mac 2; IPs updated to the current LAN. Phase 2 uses teamX-phase2.conf.

upstream team_backends {
    server 10.7.3.174:3001 max_fails=1 fail_timeout=10s;    # Backend A (Mac 3)
    server 10.7.31.162:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
}

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here, then plain HTTP to the backends
server {
    listen 443 ssl;
    http2 on;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://team_backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
