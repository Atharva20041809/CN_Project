# ---- TeamX Edge, Phase 2 — STANDBY (Mac 3, 10.7.3.174) ----  Extension E
# Same job as the primary edge; only the X-Edge label and the Backend A address differ.
#
# Setup on Mac 3:
#   brew install nginx
#   mkdir -p /opt/homebrew/etc/nginx/certs
#   copy server.crt + server.key from Mac 2 (AirDrop / scp — NEVER through Git)
#   cp teamX-standby.conf /opt/homebrew/etc/nginx/servers/teamX.conf
#   sudo nginx -t && sudo brew services start nginx
#
# The SAME certificate works here because TLS validates the NAME (SAN: app.teamX.test),
# not the IP address. Whoever holds server.key can prove it is app.teamX.test.

log_format teamx '$remote_addr [$time_local] "$request" $status '
                 'upstream=$upstream_addr ustatus=$upstream_status '
                 'urt=$upstream_response_time';

upstream team_backends {
    server 127.0.0.1:3001  max_fails=1 fail_timeout=10s;   # Backend A — same Mac, via loopback
    server 10.7.31.162:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
    # NOTE: if Mac 4 has the Extension C firewall on, add Mac 3 to its allow-list first:
    #   (on Mac 4)  sudo ./firewall/fw.sh allow 10.7.3.174
}

server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/teamx_access.log teamx;
    error_log  /opt/homebrew/var/log/nginx/teamx_error.log warn;

    add_header X-Edge            "mac3-standby"   always;
    add_header X-Upstream        $upstream_addr   always;
    add_header X-Upstream-Status $upstream_status always;

    location / {
        proxy_pass http://team_backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout       2s;
        proxy_send_timeout          5s;
        proxy_read_timeout          5s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 6s;
    }
}
